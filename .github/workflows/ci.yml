name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Read by the Maestro installer (scripts/ci-install-tool.sh); also the Maestro cache key
  MAESTRO_VERSION: 2.12.1
  # The fixed NotesApp build the flashlight job measures next to each commit's own, as a yardstick
  # for the CI machine's speed (scripts/ci-notesapp-android-reference.sh). Bumping it starts a new
  # reference history: machine factors only compare runs measured with the same tag.
  ANDROID_REFERENCE_TAG: v0.32.0

jobs:
  eslint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: ESLint
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn eslint
  typescript:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: TypeScript
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Typecheck library
        run: yarn typecheck
      - name: Typecheck examples
        run: yarn test:typescript
  ci-check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: JavaScript tests
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn test:native-unit
      - run: yarn test:metro-transform
      - run: node scripts/published-package.mjs --self-test
      - run: node scripts/next-version.mjs --self-test
      - run: node scripts/codeql-matrix.mjs --self-test
      - run: node scripts/prepare-changelog.mjs --self-test
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v5
  sync-e2e:
    # Real NitromelonDB databases (SQLite on Node, and LokiJS) syncing over HTTP with the reference
    # server in examples/sync-server. Runs on Linux only, so it doesn't wait for macOS runners.
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: Sync end-to-end
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Install the sync server
        working-directory: examples/sync-server
        run: yarn install --immutable
      - name: Typecheck the sync server
        working-directory: examples/sync-server
        run: yarn typecheck
      - run: yarn test:sync-e2e
  ci-check-windows:
    # The SQLite Node adapter (better-sqlite3) has Windows-only failure modes
    # that POSIX can't reproduce: drive-letter paths (`D:\...`) and open file
    # handles blocking deletes. The `windows` job below only builds NotesApp,
    # which uses the native adapter, so this is the only CI coverage for them.
    if: github.event.action != 'closed'
    runs-on: windows-2025
    name: JavaScript tests (Windows)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test
  notesapp-web:
    needs: [eslint, typescript, ci-check]
    runs-on: ubuntu-24.04
    name: NotesApp web (wa-sqlite)
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: yarn install --immutable
      - name: Verify vendored wa-sqlite matches upstream + the documented patch
        run: node scripts/vendor-wa-sqlite.mjs --verify
      - name: Install NotesApp
        working-directory: examples/NotesApp
        run: yarn install --immutable
      - name: Check the Babel configs in the Installation docs
        # Needs both installs: @react-native/babel-preset from the root, babel-preset-expo from NotesApp.
        run: yarn test:babel-docs
      - name: Install the sync server
        # Playwright starts it for web-tests/sync.spec.ts
        working-directory: examples/sync-server
        run: yarn install --immutable
      - name: Install Chromium
        working-directory: examples/NotesApp
        run: yarn playwright install --with-deps chromium
      - name: Export and test web SQLite
        working-directory: examples/NotesApp
        run: yarn test:web
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: notesapp-web-playwright-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            examples/NotesApp/playwright-report
            examples/NotesApp/test-results
  ios:
    needs: [eslint, typescript, ci-check]
    runs-on: macos-26
    name: iOS tests
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
      - name: cache node_modules
        uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: cache Pods
        uses: actions/cache@v5
        id: pods-cache
        with:
          path: native/iosTest/Pods
          key: ${{ runner.os }}-pods-cache-${{ hashFiles('**/Podfile.lock') }}
      - run: bundle install
      - name: 'pod install'
        run: yarn cocoapods
      - run: yarn test:ios
  android:
    needs: [eslint, typescript, ci-check]
    runs-on: ubuntu-24.04
    name: Android tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn dev:native &
      - uses: gradle/actions/setup-gradle@v5
      # See: https://github.com/android/compose-samples/actions/runs/27015993/workflow for ideas for caching
      # android-emulator-runner runs each YAML line via `sh -c`, so keep this a single command.
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          working-directory: ./native/androidTest
          script: ./gradlew connectedAndroidTest
      - run: yarn ktlint
  # NotesApp e2e: each platform builds its Release app once, in a build job, and the jobs that test
  # it (Maestro, and flashlight on Android) install that build. A flaky flow or perf run then
  # re-runs only its own job ("Re-run failed jobs"), not the build.
  notesapp-android-build:
    needs: [eslint, typescript, ci-check]
    runs-on: ubuntu-24.04
    name: NotesApp Android (build)
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Install NotesApp
        working-directory: examples/NotesApp
        run: yarn install --immutable
      - uses: gradle/actions/setup-gradle@v5
      - name: Expo prebuild Android
        working-directory: examples/NotesApp
        run: yarn expo prebuild --platform android --non-interactive --no-install
      - name: Build the release APK
        run: bash scripts/ci-notesapp-android-build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: notesapp-android-apk
          path: build-output/notesapp-release.apk
          if-no-files-found: error
          retention-days: 3
  # Built once per tag and cached (a cache hit takes seconds), for the flashlight job. Informational
  # like that job: without it, flashlight measures without adjusting for machine speed.
  notesapp-android-reference:
    needs: [eslint, typescript, ci-check]
    runs-on: ubuntu-24.04
    name: NotesApp Android (reference build)
    timeout-minutes: 60
    continue-on-error: true
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v5
        with:
          path: build-output/reference
          key: notesapp-android-reference-${{ env.ANDROID_REFERENCE_TAG }}-${{ hashFiles('scripts/ci-notesapp-android-reference.sh') }}
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set Node.js version
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: gradle/actions/setup-gradle@v5
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build the reference APK
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-notesapp-android-reference.sh "$ANDROID_REFERENCE_TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: notesapp-android-reference
          path: build-output/reference
          if-no-files-found: error
          retention-days: 3
  notesapp-android:
    needs: [notesapp-android-build]
    runs-on: ubuntu-24.04
    name: NotesApp Android (Maestro)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install the sync server
        working-directory: examples/sync-server
        run: yarn install --immutable
      # Pinned, so it can be cached: the installer downloads from GitHub release assets
      - name: cache Maestro
        uses: actions/cache@v5
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        run: bash scripts/ci-install-tool.sh Maestro https://get.maestro.mobile.dev "$HOME/.maestro/bin/maestro"
      - uses: actions/download-artifact@v7
        with:
          name: notesapp-android-apk
          path: build-output
      # android-emulator-runner runs each YAML line via `sh -c`, so keep this a single command
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          profile: pixel
          disable-animations: true
          script: bash scripts/ci-notesapp-android-maestro.sh build-output/notesapp-release.apk
      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: notesapp-android-maestro-${{ github.run_attempt }}
          if-no-files-found: ignore
          # Maestro writes its screenshots/logs under a hidden .maestro/ directory
          include-hidden-files: true
          path: maestro-debug
  # Informational (a flashlight hiccup warns instead of failing): perf-comments.yml posts the result
  # on PRs, perf-publish records it on master. Measures the reference build too, in turns with this
  # commit's, to adjust for the machine's speed (scripts/ci-notesapp-android-flashlight.sh).
  notesapp-android-flashlight:
    needs: [notesapp-android-build, notesapp-android-reference]
    if: ${{ !cancelled() && needs.notesapp-android-build.result == 'success' }}
    runs-on: ubuntu-24.04
    name: NotesApp Android (flashlight)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: cache Maestro
        uses: actions/cache@v5
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        run: bash scripts/ci-install-tool.sh Maestro https://get.maestro.mobile.dev "$HOME/.maestro/bin/maestro"
      # The installer only offers the latest release (v0.18.0, from 2024); bump the key when it changes
      - name: cache flashlight
        uses: actions/cache@v5
        with:
          path: ~/.flashlight
          key: ${{ runner.os }}-flashlight-v0.18.0
      - name: Install flashlight
        run: bash scripts/ci-install-tool.sh flashlight https://get.flashlight.dev "$HOME/.flashlight/bin/flashlight"
      - uses: actions/download-artifact@v7
        with:
          name: notesapp-android-apk
          path: build-output
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: notesapp-android-reference
          path: build-output/reference
      - name: Measure with flashlight
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          profile: pixel
          disable-animations: true
          script: bash scripts/ci-notesapp-android-flashlight.sh build-output/notesapp-release.apk build-output/reference
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-result-android
          path: |
            perf-results/perf-result-android.json
            perf-results/perf-result-android-reference.json
          if-no-files-found: ignore
  notesapp-ios-build:
    needs: [eslint, typescript, ci-check]
    runs-on: macos-26
    name: NotesApp iOS (build)
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Install NotesApp
        working-directory: examples/NotesApp
        run: yarn install --immutable
      - name: Expo prebuild iOS
        working-directory: examples/NotesApp
        # --no-install here only skips the JS install (already done above);
        # pod install is skipped separately below so the Pods cache can be
        # restored first — ios/ is gitignored and regenerated every run, so
        # there's no committed Podfile.lock to key a cache off before this.
        run: yarn expo prebuild --platform ios --non-interactive --no-install
      - name: cache Pods
        uses: actions/cache@v5
        with:
          path: |
            examples/NotesApp/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-notesapp-pods-${{ hashFiles('examples/NotesApp/ios/Podfile') }}
      - name: pod install
        working-directory: examples/NotesApp/ios
        run: pod install
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Build the simulator app
        run: bash scripts/ci-notesapp-ios-build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: notesapp-ios-app
          path: build-output/NotesApp.app.zip
          if-no-files-found: error
          retention-days: 3
  notesapp-ios:
    needs: [notesapp-ios-build]
    runs-on: macos-26
    name: NotesApp iOS (Maestro)
    timeout-minutes: 60
    env:
      # How long Maestro waits for its XCTest driver to start (ms). It gave up after ~3 minutes once,
      # on a simulator still slow from its first boot ("iOS driver not ready in time"); see also
      # the retry in scripts/ci-notesapp-ios-maestro.sh
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
    steps:
      - uses: actions/checkout@v6
      # The same Xcode as the build job, so the simulator runtimes match what the app was built for
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Booted first, so it finishes its first-boot work (data migration took almost 3 minutes once)
      # while the steps below run, instead of while Maestro starts. scripts/ci-notesapp-ios-maestro.sh
      # uses SIM_UDID and waits for the boot to finish.
      - name: Boot a simulator
        run: |
          read -r udid name < <(bash scripts/pick-ios-simulator.sh)
          echo "Booting $name ($udid)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install the sync server
        working-directory: examples/sync-server
        run: yarn install --immutable
      # Pinned, so it can be cached: the installer downloads from GitHub release assets
      - name: cache Maestro
        uses: actions/cache@v5
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        run: bash scripts/ci-install-tool.sh Maestro https://get.maestro.mobile.dev "$HOME/.maestro/bin/maestro"
      - uses: actions/download-artifact@v7
        with:
          name: notesapp-ios-app
          path: build-output
      - name: run tests
        run: bash scripts/ci-notesapp-ios-maestro.sh build-output/NotesApp.app.zip
      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: notesapp-ios-maestro-${{ github.run_attempt }}
          if-no-files-found: ignore
          # Maestro writes its screenshots/logs under a hidden .maestro/ directory
          include-hidden-files: true
          path: maestro-debug
  perf-publish:
    needs: [notesapp-android-flashlight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    name: Publish perf benchmark history
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: perf-result-android
          path: perf-results
        continue-on-error: true
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/cache@v5
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Record result on the benchmarks branch
        run: bash scripts/ci-publish-benchmark.sh "$GITHUB_SHA" "" perf-results/perf-result-android.json
      - name: Trigger docs redeploy to pick up the new benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref master
  windows:
    needs: [eslint, typescript, ci-check]
    # windows-2025 currently ships VS 2026 (v180 / MSVC v145), SDK 10.0.26100,
    # Node 24.19.0, NuGet, and WinAppDriver. Inherit MSVC from the image.
    runs-on: windows-2025
    name: Windows NotesApp
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/NotesApp_windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: yarn
          cache-dependency-path: examples/NotesApp_windows/yarn.lock
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/examples/NotesApp_windows/windows/packages
          key: nuget-notesapp-windows-${{ hashFiles('examples/NotesApp_windows/windows/**/*.vcxproj', 'native/windows/**/*.vcxproj') }}
      - name: Install NotesApp Windows
        run: yarn install --immutable
      - name: Set display resolution
        # GitHub-hosted Windows runners default to a 1024x768 virtual
        # display (actions/runner-images#2935) — smaller than the app's own
        # 1000x1000 default window, so WinAppDriver could still find and
        # click elements past the screen edge, but the click landed on
        # pixels that were never actually painted. Set-DisplayResolution is
        # a built-in Server Core cmdlet (not a third-party module) and
        # 1920x1080 is GitHub's own confirmed-working, max-supported value.
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build and deploy NotesApp (x64 Release)
        run: yarn windows -- --arch x64 --release --logging --no-packager --no-launch
      - name: Run NotesApp UI e2e
        run: yarn test:windows:e2e
      - name: Print app crash events
        # A native crash only shows up in the e2e log as "window has been closed"; the
        # Application event log has the faulting module, exception code and offset.
        if: failure()
        run: >-
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error', 'Windows Error Reporting' }
          -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
      - name: Upload e2e failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: notesapp-windows-e2e-diagnostics
          path: examples/NotesApp_windows/.tmp/diagnostics
          if-no-files-found: ignore
          retention-days: 7
