name: CI

on:
  pull_request:
  push:
    branches: master

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-24.04
    name: ESLint
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
      - run: yarn eslint
  typescript:
    runs-on: ubuntu-24.04
    name: TypeScript
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
      - name: Typecheck library
        run: yarn typecheck
      - name: Typecheck examples
        run: yarn test:typescript
  ci-check:
    runs-on: ubuntu-24.04
    name: JavaScript tests
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
      - run: yarn test
      - run: yarn test:metro-transform
      - run: node scripts/published-package.mjs --self-test
      - run: node scripts/next-version.mjs --self-test
      - run: node scripts/prepare-changelog.mjs --self-test
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4
      - name: Check docs build
        run: cd docs-website && yarn install && cd .. && yarn docs:build
  ios:
    runs-on: macos-26
    name: iOS tests
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
      - name: cache Pods
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: native/iosTest/Pods
          key: ${{ runner.os }}-pods-cache-${{ hashFiles('**/Podfile.lock') }}
      - run: bundle install
      - name: 'pod install'
        if: true # steps.pods-cache.outputs.cache-hit != 'true'
        run: yarn cocoapods
      - run: yarn test:ios
  android:
    runs-on: ubuntu-24.04
    name: Android tests
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
      - run: yarn dev:native &
      - uses: gradle/actions/setup-gradle@v3
      # See: https://github.com/android/compose-samples/actions/runs/27015993/workflow for ideas for caching
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 29
          working-directory: ./native/androidTest
          script: ./gradlew connectedAndroidTest
      - run: yarn ktlint
  windows:
    # windows-2025 already has VS 2022 17.14, SDK 10.0.26100, Node 24.19.0,
    # NuGet, and WinAppDriver. Do not use windows-11-vs2026-arm (slow extra
    # downloads) or setup-msbuild. Inherit MSVC from the image (v143).
    runs-on: windows-2025
    name: Windows NotesApp
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/NotesApp_windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: examples/NotesApp_windows/package-lock.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/examples/NotesApp_windows/windows/packages
          key: nuget-notesapp-windows-${{ hashFiles('examples/NotesApp_windows/windows/**/*.vcxproj', 'native/windows/**/*.vcxproj') }}
      - name: Install NotesApp Windows
        run: npm ci --ignore-scripts
      - name: Build and deploy NotesApp (x64 Release, integration bundle)
        run: |
          Copy-Item -Force index.integration.js index.js
          npx @react-native-community/cli run-windows --arch x64 --release --logging --no-packager --no-launch
      - name: Run SQLite integration e2e
        run: npm run test:windows:e2e
