name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: ESLint
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn eslint
  typescript:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: TypeScript
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Typecheck library
        run: yarn typecheck
      - name: Typecheck examples
        run: yarn test:typescript
  ci-check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: JavaScript tests
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn test:metro-transform
      - run: node scripts/published-package.mjs --self-test
      - run: node scripts/next-version.mjs --self-test
      - run: node scripts/prepare-changelog.mjs --self-test
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4
  ios:
    needs: [eslint, typescript, ci-check]
    runs-on: macos-26
    name: iOS tests
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: cache Pods
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: native/iosTest/Pods
          key: ${{ runner.os }}-pods-cache-${{ hashFiles('**/Podfile.lock') }}
      - run: bundle install
      - name: 'pod install'
        run: yarn cocoapods
      - run: yarn test:ios
  android:
    needs: [eslint, typescript, ci-check]
    runs-on: ubuntu-24.04
    name: Android tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn dev:native &
      - uses: gradle/actions/setup-gradle@v3
      # See: https://github.com/android/compose-samples/actions/runs/27015993/workflow for ideas for caching
      # android-emulator-runner runs each YAML line via `sh -c`, so keep this a single command.
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 29
          working-directory: ./native/androidTest
          script: ./gradlew connectedAndroidTest
      - run: yarn ktlint
  notesapp-android:
    needs: [eslint, typescript, ci-check]
    runs-on: ubuntu-24.04
    name: NotesApp Android (Maestro)
    timeout-minutes: 90
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Install NotesApp
        working-directory: examples/NotesApp
        run: yarn install --immutable
      - uses: gradle/actions/setup-gradle@v3
      - name: Expo prebuild Android
        working-directory: examples/NotesApp
        run: yarn expo prebuild --platform android --non-interactive --no-install
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install flashlight
        run: |
          curl -fsSL "https://get.flashlight.dev" | bash
          echo "$HOME/.flashlight/bin" >> "$GITHUB_PATH"
      # android-emulator-runner runs each YAML line via `sh -c`, so keep this a single command.
      # Runs the real e2e suite (blocking) then a flashlight perf measurement on the
      # same build/emulator (informational only, see scripts/ci-notesapp-android-maestro.sh).
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 29
          profile: pixel
          disable-animations: true
          script: bash scripts/ci-notesapp-android-maestro.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-result-android
          path: perf-results/perf-result-android.json
          if-no-files-found: ignore
  notesapp-ios:
    needs: [eslint, typescript, ci-check]
    runs-on: macos-26
    name: NotesApp iOS (Maestro)
    timeout-minutes: 90
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Install NotesApp
        working-directory: examples/NotesApp
        run: yarn install --immutable
      - name: Expo prebuild iOS
        working-directory: examples/NotesApp
        # --no-install here only skips the JS install (already done above);
        # pod install is skipped separately below so the Pods cache can be
        # restored first — ios/ is gitignored and regenerated every run, so
        # there's no committed Podfile.lock to key a cache off before this.
        run: yarn expo prebuild --platform ios --non-interactive --no-install
      - name: cache Pods
        uses: actions/cache@v4
        with:
          path: |
            examples/NotesApp/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-notesapp-pods-${{ hashFiles('examples/NotesApp/ios/Podfile') }}
      - name: pod install
        working-directory: examples/NotesApp/ios
        run: pod install
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: run tests
        run: bash scripts/ci-notesapp-ios-maestro.sh
  perf-comment:
    needs: [notesapp-android]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: Perf benchmark PR comment
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: perf-result-android
          path: perf-results
        continue-on-error: true
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Post perf comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/post-perf-comment.mjs \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            perf-results/perf-result-android.json
  perf-publish:
    needs: [notesapp-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    name: Publish perf benchmark history
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: perf-result-android
          path: perf-results
        continue-on-error: true
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/cache@v4
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --immutable
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Append result and push to benchmarks branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin benchmarks > /dev/null 2>&1; then
            git fetch origin benchmarks
            git worktree add -B benchmarks ../benchmarks-branch origin/benchmarks
          else
            git worktree add --detach ../benchmarks-branch
            git -C ../benchmarks-branch checkout --orphan benchmarks
            git -C ../benchmarks-branch rm -rf . > /dev/null 2>&1 || true
          fi

          node scripts/publish-perf-results.mjs \
            ../benchmarks-branch/results/benchmarks.json \
            "$GITHUB_SHA" \
            "" \
            perf-results/perf-result-android.json

          git -C ../benchmarks-branch add results/benchmarks.json
          git -C ../benchmarks-branch commit -m "chore: record perf benchmark for ${GITHUB_SHA:0:7}"
          git -C ../benchmarks-branch push origin benchmarks
      - name: Trigger docs redeploy to pick up the new benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref master
  windows:
    needs: [eslint, typescript, ci-check]
    # windows-2025 currently ships VS 2026 (v180 / MSVC v145), SDK 10.0.26100,
    # Node 24.19.0, NuGet, and WinAppDriver. Inherit MSVC from the image.
    runs-on: windows-2025
    name: Windows NotesApp
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/NotesApp_windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: yarn
          cache-dependency-path: examples/NotesApp_windows/yarn.lock
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/examples/NotesApp_windows/windows/packages
          key: nuget-notesapp-windows-${{ hashFiles('examples/NotesApp_windows/windows/**/*.vcxproj', 'native/windows/**/*.vcxproj') }}
      - name: Install NotesApp Windows
        run: yarn install --immutable
      - name: Set display resolution
        # GitHub-hosted Windows runners default to a 1024x768 virtual
        # display (actions/runner-images#2935) — smaller than the app's own
        # 1000x1000 default window, so WinAppDriver could still find and
        # click elements past the screen edge, but the click landed on
        # pixels that were never actually painted. Set-DisplayResolution is
        # a built-in Server Core cmdlet (not a third-party module) and
        # 1920x1080 is GitHub's own confirmed-working, max-supported value.
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build and deploy NotesApp (x64 Release)
        run: yarn windows -- --arch x64 --release --logging --no-packager --no-launch
      - name: Run NotesApp UI e2e
        run: yarn test:windows:e2e
      - name: Upload e2e failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notesapp-windows-e2e-diagnostics
          path: examples/NotesApp_windows/.tmp/diagnostics
          if-no-files-found: ignore
          retention-days: 7
