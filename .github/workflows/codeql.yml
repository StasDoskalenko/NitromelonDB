# Advanced CodeQL setup. Analyzes actions, c-cpp, javascript-typescript, and
# ruby without a compile (build-mode: none). Java/Kotlin and Swift need a real
# build so CodeQL can trace javac/kotlinc and xcodebuild; Default setup cannot
# find a root Gradle or Xcode project in this repo.
#
# After this workflow has run on master, disable Default setup in
# Settings → Code security → Code scanning to avoid duplicate scans.
#
# The matrix comes from scripts/codeql-matrix.mjs: on pull requests, Swift and
# Java/Kotlin (the ones that need a native build) only run when the PR changes
# code they analyze. Pushes to master, the schedule and manual runs analyze
# every language.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: Pick languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # On pull requests this is the merge commit; its first parent is the base branch
          fetch-depth: 2

      - name: Pick languages to analyze
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/codeql-matrix.mjs "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Node.js version
        if: matrix.build-mode == 'manual'
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Cache node_modules
        if: matrix.build-mode == 'manual'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24.x-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install JS dependencies
        if: matrix.build-mode == 'manual'
        run: yarn install --immutable

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v5

      - name: Set Xcode version
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        if: matrix.language == 'swift'
        uses: actions/cache@v5
        with:
          path: native/iosTest/Pods
          key: ${{ runner.os }}-pods-cache-${{ hashFiles('**/Podfile.lock') }}

      - name: Install Ruby gems
        if: matrix.language == 'swift'
        run: bundle install

      - name: Install CocoaPods
        if: matrix.language == 'swift'
        run: yarn cocoapods

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Java/Kotlin
        if: matrix.language == 'java-kotlin'
        working-directory: native/androidTest
        run: ./gradlew :watermelondb:compileDebugJavaWithJavac :watermelondb:compileDebugKotlin :app:compileDebugKotlin -PreactNativeArchitectures=arm64-v8a

      - name: Build Swift
        if: matrix.language == 'swift'
        run: |
          xcodebuild \
            -workspace native/iosTest/WatermelonTester.xcworkspace \
            -scheme WatermelonTester \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath native/iosTest/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
