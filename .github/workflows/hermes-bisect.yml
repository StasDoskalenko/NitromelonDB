# Throwaway: bisects microsoft/hermes-windows#392 by running the Windows
# NotesApp e2e against several Hermes packages. Delete with the branch.
name: Hermes bisect

on:
  push:
    branches: ['bisect/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    name: Hermes ${{ matrix.hermes }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        hermes:
          - 0.0.0-2605.6002-2279da22 # RNW 0.84 default, known good
          - 0.0.0-2607.14002-7761dc7a # last build before the Node-API weak ref change
          - 0.0.0-2607.15001-56a84a3f # Node-API weak ref change (#349)
          - 0.0.0-2607.27005-49e9f516 # + VS 2026 / Clang 22 toolchain (#352)
          - 0.0.0-2608.12001-35d34796 # RNW 0.85 default, known bad
          - 0.0.0-2610.26001-ab5bec36 # hermes-windows master today
    defaults:
      run:
        working-directory: examples/NotesApp_windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: yarn
          cache-dependency-path: examples/NotesApp_windows/yarn.lock
      - name: Install NotesApp Windows
        run: yarn install --immutable
      - name: Pin Hermes ${{ matrix.hermes }}
        run: |
          $props = 'windows/ExperimentalFeatures.props'
          $text = Get-Content $props -Raw
          $pinned = $text -replace '<HermesVersion>[^<]*</HermesVersion>', '<HermesVersion>${{ matrix.hermes }}</HermesVersion>'
          if ($pinned -eq $text -and '${{ matrix.hermes }}' -ne '0.0.0-2605.6002-2279da22') { throw 'HermesVersion pin not found' }
          Set-Content $props $pinned -NoNewline
          Select-String -Path $props -Pattern 'HermesVersion>'
      - name: Set display resolution
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build and deploy NotesApp
        run: yarn windows -- --arch x64 --release --logging --no-packager --no-launch
      - name: Show the deployed hermes.dll
        run: |
          Get-ChildItem -Recurse -Filter hermes.dll windows |
            ForEach-Object { '{0}  {1}  {2}' -f $_.VersionInfo.FileVersion, $_.Length, $_.FullName }
      - name: Run NotesApp UI e2e
        run: yarn test:windows:e2e
      - name: Print app crash events
        if: failure()
        run: >-
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error', 'Windows Error Reporting' }
          -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
