name: Publish Release

on:
  # npm OIDC trusted publishing rejects pull_request_target tokens
  # (OIDC token exchange 404 "package not found"). workflow_dispatch
  # from master works; so does push to master. See npm/cli#8739.
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.head_commit != null &&
        (
          startsWith(github.event.head_commit.message, 'chore: release v') ||
          startsWith(github.event.head_commit.message, 'Release v') ||
          contains(github.event.head_commit.message, '/release/v')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC (npm trusted publishers)
      contents: write # Tag + GitHub Release (official example is contents: read because it only publishes)
      pull-requests: write
    steps:
      - name: Ensure workflow ran from master
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Run Publish Release from the master branch (selected: ${{ github.ref_name }})"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do not set registry-url. setup-node then writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and a dummy
          # NODE_AUTH_TOKEN, and npm skips OIDC (PUT 404 / ENEEDAUTH).
          package-manager-cache: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-alpha."* ]]; then
            CHANNEL_TAG=alpha
            IS_PRERELEASE=true
          elif [[ "$VERSION" == *"-beta."* ]]; then
            CHANNEL_TAG=beta
            IS_PRERELEASE=true
          else
            CHANNEL_TAG=latest
            IS_PRERELEASE=false
          fi

          OVERRIDE=none
          if [ -f .github/publish-npm-tag ]; then
            OVERRIDE=$(tr -d '[:space:]' < .github/publish-npm-tag)
          fi
          case "$OVERRIDE" in
            none|latest|alpha|beta|'') ;;
            *)
              echo "⚠️ Ignoring invalid .github/publish-npm-tag value: $OVERRIDE"
              OVERRIDE=none
              ;;
          esac
          if [ -z "$OVERRIDE" ] || [ "$OVERRIDE" = "none" ]; then
            DIST_TAG="$CHANNEL_TAG"
          else
            DIST_TAG="$OVERRIDE"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "channel_tag=$CHANNEL_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "CHANNEL_TAG=$CHANNEL_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "📦 Version: $VERSION (npm tag: $DIST_TAG, channel: $CHANNEL_TAG)"

      - name: Extract release notes
        run: |
          if ! node scripts/prepare-changelog.mjs extract "${{ env.NEW_VERSION }}" > /tmp/release_notes.md; then
            echo "See the changelog for details." > /tmp/release_notes.md
          fi
          if [ ! -s /tmp/release_notes.md ]; then
            echo "See the changelog for details." > /tmp/release_notes.md
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn build

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            sed -i '/always-auth/d' "$NPM_CONFIG_USERCONFIG"
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "❌ ACTIONS_ID_TOKEN_REQUEST_URL is unset; id-token: write did not take effect"
            exit 1
          fi
          if npm view "nitromelondb@${{ env.NEW_VERSION }}" version >/dev/null 2>&1; then
            echo "nitromelondb@${{ env.NEW_VERSION }} is already on npm, skipping publish"
          else
            npm publish ./dist --access public --tag "${{ env.DIST_TAG }}" --verbose
            echo "✅ Published nitromelondb@${{ env.NEW_VERSION }} with tag ${{ env.DIST_TAG }}"
            if [ "${{ env.IS_PRERELEASE }}" = "true" ] && [ "${{ env.DIST_TAG }}" != "${{ env.CHANNEL_TAG }}" ]; then
              if npm dist-tag add "nitromelondb@${{ env.NEW_VERSION }}" "${{ env.CHANNEL_TAG }}"; then
                echo "✅ Also set dist-tag ${{ env.CHANNEL_TAG }}"
              else
                echo "⚠️ Could not add dist-tag ${{ env.CHANNEL_TAG }} (OIDC may only allow npm publish)"
              fi
            fi
          fi

      - name: Create git tag
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping create"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ Tag created: $TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists, skipping create"
          elif [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md --prerelease
            echo "✅ GitHub Release created: $TAG (prerelease)"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md
            echo "✅ GitHub Release created: $TAG"
          fi

      - name: Comment on PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No merged PR found for this commit, skipping comment"
            exit 0
          fi
          gh pr comment "$PR" --body \
            "🎉 **nitromelondb@${{ env.NEW_VERSION }} published**

          📦 **npm:** [nitromelondb@${{ env.NEW_VERSION }}](https://www.npmjs.com/package/nitromelondb/v/${{ env.NEW_VERSION }}) (\`${{ env.DIST_TAG }}\`)
          🔖 **Release:** [v${{ env.NEW_VERSION }}](https://github.com/${{ github.repository }}/releases/tag/v${{ env.NEW_VERSION }})

          Install with:
          \`\`\`bash
          npm install nitromelondb@${{ env.NEW_VERSION }}
          # or
          yarn add nitromelondb@${{ env.NEW_VERSION }}
          \`\`\`"

          echo "✅ PR comment posted"

      - name: Summary
        run: |
          echo "🎉 Release v${{ env.NEW_VERSION }} complete!"
          echo "✅ npm: https://www.npmjs.com/package/nitromelondb/v/${{ env.NEW_VERSION }}"
          echo "✅ Release: https://github.com/${{ github.repository }}/releases/tag/v${{ env.NEW_VERSION }}"
