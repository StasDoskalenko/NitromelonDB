name: Publish Release

on:
  # npm OIDC trusted publishing rejects pull_request_target tokens
  # (OIDC token exchange 404 "package not found"). workflow_dispatch
  # from master works; so does push to master. See npm/cli#8739.
  # Release lines (release/X.Y.x, see README.md) publish the same way, from their own branch.
  push:
    branches:
      - master
      - 'release/*.x'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.head_commit != null &&
        (
          startsWith(github.event.head_commit.message, 'chore: release v') ||
          startsWith(github.event.head_commit.message, 'Release v') ||
          contains(github.event.head_commit.message, '/release/v')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC (npm trusted publishers)
      contents: write # Tag + GitHub Release (official example is contents: read because it only publishes)
      pull-requests: write
    steps:
      - name: Ensure workflow ran from master or a release line
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != branch ] || ! [[ "$BRANCH" == master || "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.x$ ]]; then
            echo "❌ Run Publish Release from master or a release/X.Y.x branch (selected: $BRANCH)"
            exit 1
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do not set registry-url. setup-node then writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and a dummy
          # NODE_AUTH_TOKEN, and npm skips OIDC (PUT 404 / ENEEDAUTH).
          package-manager-cache: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-alpha."* ]]; then
            CHANNEL_TAG=alpha
            IS_PRERELEASE=true
          elif [[ "$VERSION" == *"-beta."* ]]; then
            CHANNEL_TAG=beta
            IS_PRERELEASE=true
          else
            CHANNEL_TAG=latest
            IS_PRERELEASE=false
          fi

          OVERRIDE=none
          if [ -f .github/publish-npm-tag ]; then
            OVERRIDE=$(tr -d '[:space:]' < .github/publish-npm-tag)
          fi
          case "$OVERRIDE" in
            none|latest|alpha|beta|'') ;;
            *)
              echo "⚠️ Ignoring invalid .github/publish-npm-tag value: $OVERRIDE"
              OVERRIDE=none
              ;;
          esac
          if [ -z "$OVERRIDE" ] || [ "$OVERRIDE" = "none" ]; then
            # Channels only move forward: a release line's hotfix (0.32.2 after 0.33.0) gets latest-0.32
            CURRENT=$(npm view nitromelondb "dist-tags.${CHANNEL_TAG}" 2>/dev/null || true)
            DIST_TAG=$(node scripts/next-version.mjs --dist-tag "$VERSION" "$CHANNEL_TAG" "$CURRENT")
            if [ "$DIST_TAG" != "$CHANNEL_TAG" ]; then
              echo "ℹ️ ${CHANNEL_TAG} is on ${CURRENT}, newer than ${VERSION}: publishing as ${DIST_TAG}"
            fi
          else
            DIST_TAG="$OVERRIDE"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "channel_tag=$CHANNEL_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "CHANNEL_TAG=$CHANNEL_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "📦 Version: $VERSION (npm tag: $DIST_TAG, channel: $CHANNEL_TAG)"

      - name: Extract release notes
        run: |
          if ! node scripts/prepare-changelog.mjs extract "${{ env.NEW_VERSION }}" > /tmp/release_notes.md; then
            echo "See the changelog for details." > /tmp/release_notes.md
          fi
          # `-s` only checks byte size; `extract` prints via `console.log()`,
          # which emits a trailing newline even for an empty string, so a
          # "no notes" result is a 1-byte file that `-s` reports as non-empty
          # -- this fallback never fired as a result (see the identical fix
          # in prepare-release.yml). Strip whitespace before testing.
          if [ -z "$(tr -d '[:space:]' < /tmp/release_notes.md)" ]; then
            echo "See the changelog for details." > /tmp/release_notes.md
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn build

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            sed -i '/always-auth/d' "$NPM_CONFIG_USERCONFIG"
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "❌ ACTIONS_ID_TOKEN_REQUEST_URL is unset; id-token: write did not take effect"
            exit 1
          fi
          if npm view "nitromelondb@${{ env.NEW_VERSION }}" version >/dev/null 2>&1; then
            echo "nitromelondb@${{ env.NEW_VERSION }} is already on npm, skipping publish"
          else
            npm publish ./dist --access public --tag "${{ env.DIST_TAG }}" --verbose
            echo "✅ Published nitromelondb@${{ env.NEW_VERSION }} with tag ${{ env.DIST_TAG }}"
            if [ "${{ env.IS_PRERELEASE }}" = "true" ] && [ "${{ env.DIST_TAG }}" != "${{ env.CHANNEL_TAG }}" ]; then
              if npm dist-tag add "nitromelondb@${{ env.NEW_VERSION }}" "${{ env.CHANNEL_TAG }}"; then
                echo "✅ Also set dist-tag ${{ env.CHANNEL_TAG }}"
              else
                echo "⚠️ Could not add dist-tag ${{ env.CHANNEL_TAG }} (OIDC may only allow npm publish)"
              fi
            fi
          fi

      - name: Create git tag
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping create"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ Tag created: $TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists, skipping create"
          elif [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md --prerelease
            echo "✅ GitHub Release created: $TAG (prerelease)"
          elif [ "${{ env.DIST_TAG }}" != latest ]; then
            # An older line's release: GitHub's "Latest" stays on the newest version
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md --latest=false
            echo "✅ GitHub Release created: $TAG (not marked Latest)"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md
            echo "✅ GitHub Release created: $TAG"
          fi

      # master's CHANGELOG.md gets this release's entry (and loses the alphas it folded), and its
      # package.json moves up if it's behind. CHANGELOG-Unreleased.md stays: master's own changes
      # since the line was cut are still unreleased. Safe to re-run: no PR when master has it.
      - name: Record the release on master
        if: env.BRANCH != 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SYNC_BRANCH="sync/v${NEW_VERSION}"
          MASTER_DIR="$RUNNER_TEMP/master"
          git fetch -q origin master
          git worktree add -q -B "$SYNC_BRANCH" "$MASTER_DIR" origin/master
          # From inside the checkout: the script only runs as a command when its path matches its
          # real path, which a symlinked temp directory breaks
          (cd "$MASTER_DIR" && node scripts/prepare-changelog.mjs record "$NEW_VERSION" "$GITHUB_WORKSPACE/CHANGELOG.md")
          if ! grep -q "^## ${NEW_VERSION} " "$MASTER_DIR/CHANGELOG.md"; then
            echo "❌ master's CHANGELOG.md still has no ${NEW_VERSION} entry"
            exit 1
          fi
          MASTER_VERSION=$(node -p "require('$MASTER_DIR/package.json').version")
          if [ "$(node scripts/next-version.mjs --compare "$NEW_VERSION" "$MASTER_VERSION")" = 1 ]; then
            for pkg in package.json docs-website/package.json; do
              node -e "
                const fs = require('fs');
                const file = process.argv[1];
                const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
                pkg.version = process.env.NEW_VERSION;
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
              " "$MASTER_DIR/$pkg"
            done
            echo "master's package.json: ${MASTER_VERSION} → ${NEW_VERSION}"
          fi
          if git -C "$MASTER_DIR" diff --quiet; then
            echo "master already records v${NEW_VERSION}"
            exit 0
          fi
          if [ -n "$(gh pr list --head "$SYNC_BRANCH" --base master --state open --json url --jq '.[0].url // empty')" ]; then
            echo "A PR for $SYNC_BRANCH is already open"
            exit 0
          fi
          git -C "$MASTER_DIR" commit -q -a -m "chore: record v${NEW_VERSION} from ${BRANCH}"
          git -C "$MASTER_DIR" push -q --force-with-lease origin "$SYNC_BRANCH"
          {
            echo "v${NEW_VERSION} was published from \`${BRANCH}\`. This adds its changelog entry to master's \`CHANGELOG.md\` (replacing the prerelease entries it folded), and moves \`package.json\` up if master was behind."
            echo ""
            echo "\`CHANGELOG-Unreleased.md\` is unchanged: master's changes since the line was cut are still unreleased. The next release from master needs \`minor\` or \`major\`."
          } > /tmp/sync_body.md
          gh pr create --base master --head "$SYNC_BRANCH" \
            --title "chore: record v${NEW_VERSION} from ${BRANCH}" --body-file /tmp/sync_body.md
          echo "✅ Opened the PR that records v${NEW_VERSION} on master"

      - name: Comment on PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No merged PR found for this commit, skipping comment"
            exit 0
          fi
          gh pr comment "$PR" --body \
            "🎉 **nitromelondb@${{ env.NEW_VERSION }} published**

          📦 **npm:** [nitromelondb@${{ env.NEW_VERSION }}](https://www.npmjs.com/package/nitromelondb/v/${{ env.NEW_VERSION }}) (\`${{ env.DIST_TAG }}\`)
          🔖 **Release:** [v${{ env.NEW_VERSION }}](https://github.com/${{ github.repository }}/releases/tag/v${{ env.NEW_VERSION }})

          Install with:
          \`\`\`bash
          npm install nitromelondb@${{ env.NEW_VERSION }}
          # or
          yarn add nitromelondb@${{ env.NEW_VERSION }}
          \`\`\`"

          echo "✅ PR comment posted"

      - name: Summary
        run: |
          echo "🎉 Release v${{ env.NEW_VERSION }} complete!"
          echo "✅ npm: https://www.npmjs.com/package/nitromelondb/v/${{ env.NEW_VERSION }}"
          echo "✅ Release: https://github.com/${{ github.repository }}/releases/tag/v${{ env.NEW_VERSION }}"
