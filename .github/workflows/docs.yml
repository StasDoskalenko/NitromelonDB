name: Deploy docs

on:
  push:
    branches:
      - master
    paths:
      - 'docs-website/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'scripts/update-docusaurus'
      - 'scripts/rewrite-readme-docs-links.mjs'
      - 'scripts/replace-docs-path.mjs'
      - '.github/workflows/docs.yml'
  # Triggered by perf-publish (.github/workflows/ci.yml) after it pushes a new
  # benchmark record to the `benchmarks` branch -- that push doesn't touch any
  # of the paths above (or even this branch), so it wouldn't otherwise cause
  # the Performance page to pick up the new data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: docs-website/yarn.lock
      - name: Install docs dependencies
        run: yarn install --immutable
        working-directory: docs-website
      - name: Sync markdown into Docusaurus
        run: ./scripts/update-docusaurus
      - name: Build website
        run: yarn build
        working-directory: docs-website
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
