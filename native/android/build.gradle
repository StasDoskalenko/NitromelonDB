buildscript {
    ext.getExtOrDefault = { name ->
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['ReactNativeWatermelonDB_' + name]
    }

    ext.getExtOrIntegerDefault = { name ->
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['ReactNativeWatermelonDB_' + name]).toInteger()
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}")
    }
}

def reactNativeArchitectures() {
    def value = rootProject.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// Database encryption is opt-in at build time, because the cipher code changes how an app answers
// App Store / export-compliance questions and adds to its size (docs: Advanced/Encryption).
// NITROMELONDB_ENCRYPTION=1|0 wins; otherwise `"nitromelondb": { "encryption": true }` in the app's
// package.json, the first one found above the Android project (android/ in a standard app),
// skipping NitromelonDB's own.
def parseNitromelonEncryptionFlag(Object value, String source) {
    if (value instanceof Boolean) {
        return value
    }
    def text = value?.toString()?.trim()?.toLowerCase()
    if (text in ["1", "true"]) {
        return true
    }
    if (text in ["0", "false"]) {
        return false
    }
    throw new GradleException("NitromelonDB: ${source} must be true or false, got '${value}'")
}

def isNitromelonEncryptionEnabled() {
    def env = System.getenv("NITROMELONDB_ENCRYPTION")
    if (env != null && env.trim() != "") {
        return parseNitromelonEncryptionFlag(env, "NITROMELONDB_ENCRYPTION")
    }
    def dir = rootProject.projectDir.parentFile
    while (dir != null) {
        def packageJson = new File(dir, "package.json")
        if (packageJson.isFile()) {
            def appPackage = new groovy.json.JsonSlurper().parse(packageJson)
            // Our own package.json (this repo's test apps live inside the library)
            if (appPackage?.name == "nitromelondb") {
                dir = dir.parentFile
                continue
            }
            def options = appPackage?.nitromelondb
            if (options == null || options.encryption == null) {
                return false
            }
            if (!(options.encryption instanceof Boolean)) {
                throw new GradleException("NitromelonDB: \"nitromelondb\": { \"encryption\" } in ${packageJson} must be true or false, got '${options.encryption}'")
            }
            return options.encryption
        }
        dir = dir.parentFile
    }
    return false
}

def nitromelonEncryption = isNitromelonEncryptionEnabled()
if (nitromelonEncryption) {
    logger.lifecycle("NitromelonDB: SQLite encryption build (SQLite3 Multiple Ciphers)")
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

android {
    compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')
    buildToolsVersion getExtOrDefault('buildToolsVersion')

    namespace "com.nitromelondb"

    buildFeatures {
        buildConfig true
        prefab true
    }

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault('minSdkVersion')
        targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
        versionCode 1
        versionName "1.0"
        consumerProguardFiles "proguard-rules.pro"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DNITROMELON_ENCRYPTION=${nitromelonEncryption ? 'ON' : 'OFF'}"
                abiFilters(*reactNativeArchitectures())

                buildTypes {
                    debug {
                        cppFlags "-O1 -g"
                    }
                    release {
                        cppFlags "-O2"
                    }
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Nitrogen generates `../nitrogen/...` paths assuming CMakeLists
            // lives in a directory next to the package root (standard `android/`).
            path file("../../android/CMakeLists.txt")
        }
    }

    sourceSets {
        main {
            def nitrogenKotlin = "${project.projectDir}/../../nitrogen/generated/android/kotlin"
            java.srcDirs += [nitrogenKotlin]
            // AGP 9's built-in Kotlin (android.builtInKotlin=true) only compiles .kt files from the
            // Kotlin source directories, not from java.srcDirs
            kotlin.srcDirs += [nitrogenKotlin]
        }
    }

    packagingOptions {
        excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libNitroModules.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
        ]
    }
}

apply from: './fix-prefab.gradle'

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-android'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${getExtOrDefault('kotlinVersion')}"
    implementation project(":react-native-nitro-modules")
}

repositories {
    google()
    mavenCentral()
}
