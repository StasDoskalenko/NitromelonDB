# Metro, Gradle, CocoaPods, and patch-package in the Expo examples all need a
# real node_modules tree. Do not switch this to PnP.
nodeLinker: node-modules

# Yarn 4.18 defaults this to false. better-sqlite3, the Windows Nitro shims,
# and Expo patch-package all need install scripts.
enableScripts: true

# Yarn 4 rejects git dependencies unless the repo is allowlisted.
approvedGitRepositories:
  - https://github.com/Nozbe/cavy.git
  - https://github.com/radex/big-list-of-naughty-strings.git

# Yarn 4 defaults this to 1d. Keep installs from failing on freshly published
# packages when CI refreshes lockfile metadata.
npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.18.0.cjs
