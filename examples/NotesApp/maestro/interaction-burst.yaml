# Rapid add / pin / delete (C8). Seeded list is already 100 notes.
# Run from examples/NotesApp: maestro test maestro/interaction-burst.yaml
#
# Single tapOn on both platforms — see add-pin-delete.yaml.

appId: com.nitromelondb.example
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "subtitle"
    timeout: 60000

- assertVisible:
    text: ".*100 notes.*"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Burst Note 1"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Burst Note 2"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Burst Note 3"

- assertVisible:
    text: "Burst Note 1"
- assertVisible:
    text: "Burst Note 2"
- assertVisible:
    text: "Burst Note 3"
- assertVisible:
    text: ".*103 notes.*"

- tapOn: "NitromelonDB"
- waitForAnimationToEnd

- tapOn:
    id: "pin-button-Burst-Note-3"
- tapOn:
    id: "pin-button-Burst-Note-2"
- tapOn:
    id: "pin-button-Burst-Note-1"
- tapOn:
    id: "delete-button-Burst-Note-3"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Unpin"
    timeout: 15000

- assertNotVisible:
    text: "Burst Note 3"

- assertVisible:
    text: ".*102 notes.*"

- assertVisible:
    id: "notes-list"
