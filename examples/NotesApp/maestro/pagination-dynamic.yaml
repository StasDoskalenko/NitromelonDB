# Adding notes updates the count and page count; pager still windows with skip/take.
# After 5 inserts (105 notes → 6 pages): page 1 is Dynamic Note 5…1 + Note #100…#86.
# Page 2 is Note #85…#66 (includes #80).
# Run from examples/NotesApp: maestro test maestro/pagination-dynamic.yaml

appId: com.nitromelondb.example
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "subtitle"
    timeout: 60000

- assertVisible:
    text: ".*100 notes.*"
- assertVisible:
    text: "Page 1 of 5"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Dynamic Note 1"
- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Dynamic Note 2"
- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Dynamic Note 3"
- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Dynamic Note 4"
- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Dynamic Note 5"

- tapOn: "NitromelonDB"
- waitForAnimationToEnd

- assertVisible:
    text: ".*105 notes.*"
- assertVisible:
    text: "Page 1 of 6"
- assertVisible:
    text: "Dynamic Note 5"
# Step the list down with slow, short drags until Note #100 (6th on the page) shows up.
# Not scrollUntilVisible: its swipes fling, and with only ~2 cards visible between the pager
# and the composer, one fling on a slow emulator could carry Note #100 from below the
# composer to above the pager between two checks -- after which scrolling DOWN never
# finds it. A slow drag (~270px, < one card) has no momentum, so it can't skip the target.
- repeat:
    while:
      notVisible: "Note #100"
    times: 12
    commands:
      - swipe:
          start: "50%, 62%"
          end: "50%, 48%"
          duration: 1500
- assertVisible:
    text: "Note #100"
- assertNotVisible:
    text: "Note #80"

- tapOn:
    id: "next-page-button"
- waitForAnimationToEnd

- assertVisible:
    text: "Page 2 of 6"
- assertVisible:
    text: ".*105 notes.*"
- assertNotVisible:
    text: "Dynamic Note 5"
- assertNotVisible:
    text: "Note #100"
- assertVisible:
    text: "Note #85"

- tapOn:
    id: "prev-page-button"
- waitForAnimationToEnd

- assertVisible:
    text: "Page 1 of 6"
- assertVisible:
    text: "Dynamic Note 5"
