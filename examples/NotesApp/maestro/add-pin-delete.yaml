# Add, pin, and delete against the live database.
# Run from examples/NotesApp: maestro test maestro/add-pin-delete.yaml
#
# Single tapOn on both platforms: doubleTapOn used to be needed on iOS because
# single taps were dropped by XCTest/Fabric, but on a Release build it now
# registers both taps as real presses, toggling pin/delete twice and
# cancelling out — same class of issue Android already moved off of.

appId: com.nitromelondb.example
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "subtitle"
    timeout: 60000

- assertVisible:
    text: ".*100 notes.*"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Test Note"

- assertVisible:
    text: "Test Note"

- assertVisible:
    text: ".*101 notes.*"

- tapOn: "NitromelonDB"
- waitForAnimationToEnd

- tapOn:
    id: "pin-button-Test-Note"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Unpin"
    timeout: 15000

- assertVisible:
    text: "Unpin"

- tapOn:
    id: "delete-button-Test-Note"
- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Test Note"
    timeout: 15000

- assertNotVisible:
    text: "Test Note"

- assertVisible:
    text: ".*100 notes.*"
