# Add, pin, and delete against the live database.
# Run from examples/NotesApp: maestro test maestro/add-pin-delete.yaml
#
# FlatList row Pressables need doubleTapOn — single taps are dropped by XCTest/Fabric.
# Delete is debounced in-app so the second half of doubleTapOn does not remove two rows.

appId: com.nitromelondb.example
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "subtitle"
    timeout: 60000

- assertVisible:
    text: ".*100 notes.*"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Test Note"

- assertVisible:
    text: "Test Note"

- assertVisible:
    text: ".*101 notes.*"

- tapOn: "NitromelonDB"
- waitForAnimationToEnd

- runFlow:
    when:
      platform: iOS
    commands:
      - doubleTapOn:
          id: "pin-button-Test Note"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "pin-button-Test Note"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Unpin"
    timeout: 15000

- assertVisible:
    text: "Unpin"

- runFlow:
    when:
      platform: iOS
    commands:
      - doubleTapOn:
          id: "delete-button-Test Note"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "delete-button-Test Note"
- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Test Note"
    timeout: 15000

- assertNotVisible:
    text: "Test Note"

- assertVisible:
    text: ".*100 notes.*"
