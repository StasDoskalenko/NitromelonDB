# Performance benchmark flow — not part of the default `maestro test maestro/`
# sweep (excluded via --exclude-tags perf in the CI scripts; run explicitly
# with `maestro test maestro/perf-run.yaml` or `--include-tags perf`).
#
# Drives a representative heavy workload (write/pin/delete churn, then a full
# 5-page pagination sweep with a long scroll) while PerfHUD
# (src/components/PerfHUD.tsx) samples CPU/memory/JS+UI FPS in the
# background. The resulting JSON summary is read back via copyTextFrom +
# evalScript — see scripts/extract-perf-result.mjs for how CI pulls it out
# of the `--debug-output --flatten-debug-output` log.
#
# Run from examples/NotesApp: maestro test maestro/perf-run.yaml

appId: com.nitromelondb.example
tags:
  - perf
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "subtitle"
    timeout: 60000

- assertVisible:
    text: ".*100 notes.*"

- tapOn:
    id: "perf-start-button"

# Write/subscription churn: add, pin, delete.
- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Perf Note 1"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Perf Note 2"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Perf Note 3"

- tapOn: "NitromelonDB"
- waitForAnimationToEnd

- tapOn:
    id: "pin-button-Perf-Note-3"
- tapOn:
    id: "pin-button-Perf-Note-2"
- tapOn:
    id: "pin-button-Perf-Note-1"
- tapOn:
    id: "delete-button-Perf-Note-3"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Unpin"
    timeout: 15000

# List rendering / scroll load: page through to the last page. Note count
# isn't exactly 100 here (net +2 from the churn above), so page forward
# until the button disables rather than a fixed number of taps.
- repeat:
    while:
      visible:
        id: "next-page-button"
        enabled: true
    commands:
      - tapOn:
          id: "next-page-button"
      - waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Note #1"
    direction: DOWN
    timeout: 25000
    speed: 40
    visibilityPercentage: 40

- tapOn:
    id: "perf-stop-button"

# stop() triggers a React state update; wait for the summary JSON to
# actually land in the text element before copying it, rather than racing
# copyTextFrom against the re-render (it previously copied "" once).
- extendedWaitUntil:
    visible:
      id: "perf-summary-json"
      text: ".*sampleCount.*"
    timeout: 5000

- copyTextFrom:
    id: "perf-summary-json"
- evalScript: "${output.perf = maestro.copiedText}"
- evalScript: "${console.log('===PERF_JSON_START===' + output.perf + '===PERF_JSON_END===')}"
