# Data must survive process death (Documents-directory SQLite).
# Run from examples/NotesApp: maestro test maestro/kill-and-relaunch.yaml

appId: com.nitromelondb.example
---
- launchApp:
    clearState: true

# Seed is async — wait for subtitle (only visible after seeding).
- extendedWaitUntil:
    visible:
      id: "subtitle"
    timeout: 60000

- assertVisible:
    text: ".*100 notes.*"

- runFlow:
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Persistent Note"

# No hideKeyboard needed — see add-note.yaml.

- assertVisible:
    text: "Persistent Note"

- assertVisible:
    text: ".*101 notes.*"

- killApp

- launchApp: {}

- assertVisible:
    id: "subtitle"

- assertVisible:
    text: "Persistent Note"

- assertVisible:
    text: ".*101 notes.*"

- assertVisible:
    id: "notes-list"
