# Step 11 (iOS, encryption build, plaintext header layout): opened without encryption.plaintextHeader,
# the database is re-keyed back into the usual layout, and its salt file is deleted. As in step 10,
# a note added after that proves the re-key finished, and a cold start opens it again. See README.md.
appId: com.nitromelondb.example
---
- launchApp:
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "encryption-status"
      text: "Encrypted"
    timeout: 60000

# Not on a retry after it was already added
- runFlow:
    when:
      notVisible:
        text: "Without a plaintext header"
    file: ../maestro-commands/add-note.yaml
    env:
      TITLE: "Without a plaintext header"

- launchApp:
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "encryption-status"
      text: "Encrypted"
    timeout: 60000
- assertVisible:
    text: "Without a plaintext header"
- assertVisible:
    text: "With a plaintext header"
