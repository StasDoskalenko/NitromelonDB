# Step 12 (encryption build, encrypted database): progress. Adds about 135 MB of filler notes
# (src/fillerNotes.ts), so that decrypting and encrypting take longer than the 200 ms between
# progress updates, then decrypts and encrypts it. After each, `encryption-progress` says what
# encryption.events.onProgress reported (src/hooks/useEncryptionProgressLog.ts): at least one
# update, between 0 and 1, never going back. See README.md.
appId: com.nitromelondb.example
---
- launchApp:
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "encryption-status"
    timeout: 60000

# On a retry that stopped after decrypting: encrypted again first
- runFlow:
    when:
      visible:
        id: "encrypt-button"
    commands:
      - tapOn:
          id: "encrypt-button"
      - extendedWaitUntil:
          visible:
            id: "encryption-status"
            text: "Encrypted"
          timeout: 180000

# Not on a retry after the filler was added (the count is then in the hundred thousands)
- runFlow:
    when:
      visible:
        text: ".*· [0-9]{1,3} notes?"
    commands:
      - tapOn:
          id: "fill-button"
      - extendedWaitUntil:
          visible:
            id: "fill-status"
            text: "Added [0-9]+ notes"
          timeout: 180000

- tapOn:
    id: "decrypt-button"
- extendedWaitUntil:
    visible:
      id: "encryption-status"
      text: "Not encrypted"
    timeout: 180000
- assertVisible:
    id: "encryption-progress"
    text: "decrypt: [1-9][0-9]* progress updates?, only forward, [0-9]+ ms"

- tapOn:
    id: "encrypt-button"
- extendedWaitUntil:
    visible:
      id: "encryption-status"
      text: "Encrypted"
    timeout: 180000
- assertVisible:
    id: "encryption-progress"
    text: "encrypt: [1-9][0-9]* progress updates?, only forward, [0-9]+ ms"
